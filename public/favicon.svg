<?xml version="1.0" encoding="UTF-8"?>
<!-- til. favicon — 64×64 rounded dark square with the two-ring dot mark.
     Wordmark "til." doesn't render at favicon sizes; the mark is the brand at small sizes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="til.">
  <defs>
    <linearGradient id="til-fav-ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#F5E6A8"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="til-fav-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#E8D5A0"/>
      <stop offset="100%" stop-color="#C9A961"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#0A0A0A"/>
  <!-- Two-ring dot, centered. Same geometry as logo-mark.svg, scaled. -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#til-fav-ring)" stroke-width="4.4"/>
  <circle cx="37" cy="32" r="14" fill="url(#til-fav-core)"/>
</svg>
